  <style>
    /* ── Design tokens ─────────────────────────────────── */
    :root {
      --cream:       #F9F5EF;
      --parchment:   #EFE8DA;
      --ink:         #2B2416;
      --ink-mid:     #5C4F3A;
      --ink-light:   #9A8B73;
      --amber:       #C97B2A;
      --amber-light: #E8A84E;
      --amber-pale:  #FBF0DE;
      --red-warn:    #B03A2E;
      --radius:      10px;
      --shadow:      0 4px 24px rgba(43,36,22,.10);
      --transition:  .25s ease;
    }

    /* ── Reset / base ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.65;
    }

    /* ── Layout ─────────────────────────────────────────── */
    #app {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 3rem 0 2rem;
      border-bottom: 2px solid var(--parchment);
      margin-bottom: 2.5rem;
    }
    header .ornament {
      font-size: 2rem;
      line-height: 1;
      color: var(--amber);
      letter-spacing: .2em;
      margin-bottom: .75rem;
      display: block;
    }
    header h1 {
      font-family: 'Lora', serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--ink);
    }
    header p.subtitle {
      color: var(--ink-mid);
      font-size: .95rem;
      margin-top: .4rem;
      font-weight: 300;
    }

    /* ── Cards ──────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid var(--parchment);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      animation: fadeUp .4s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Progress bar ───────────────────────────────────── */
    #progress-wrap {
      margin-bottom: 1.75rem;
    }
    #progress-label {
      display: flex;
      justify-content: space-between;
      font-size: .78rem;
      color: var(--ink-light);
      margin-bottom: .45rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    #progress-bar {
      height: 5px;
      background: var(--parchment);
      border-radius: 99px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--amber), var(--amber-light));
      border-radius: 99px;
      transition: width .5s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }

    /* ── Chapter title ──────────────────────────────────── */
    .chapter-title {
      font-family: 'Lora', serif;
      font-size: 1.25rem;
      color: var(--amber);
      font-weight: 400;
      font-style: italic;
      margin-bottom: .25rem;
    }
    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.45;
      margin-bottom: 1.25rem;
    }

    /* ── Textarea ───────────────────────────────────────── */
    textarea {
      width: 100%;
      min-height: 140px;
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius);
      padding: .85rem 1rem;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 1rem;
      color: var(--ink);
      background: var(--cream);
      resize: vertical;
      transition: border-color var(--transition), box-shadow var(--transition);
      line-height: 1.6;
    }
    textarea:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(201,123,42,.12);
      background: #fff;
    }
    textarea::placeholder { color: var(--ink-light); }

    /* ── Buttons ────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .7rem 1.6rem;
      border-radius: var(--radius);
      font-family: 'Source Sans 3', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition);
      letter-spacing: .01em;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary {
      background: var(--amber);
      color: #fff;
    }
    .btn-primary:not(:disabled):hover {
      background: var(--amber-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(201,123,42,.3);
    }
    .btn-secondary {
      background: transparent;
      border: 1.5px solid var(--parchment);
      color: var(--ink-mid);
    }
    .btn-secondary:not(:disabled):hover {
      background: var(--parchment);
    }
    .btn-row {
      display: flex;
      gap: .75rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }

    /* ── Inputs ─────────────────────────────────────────── */
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: .7rem 1rem;
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 1rem;
      color: var(--ink);
      background: var(--cream);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    input[type="text"]:focus, input[type="password"]:focus, select:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(201,123,42,.12);
      background: #fff;
    }
    select { appearance: none; cursor: pointer; }
    label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      color: var(--ink-mid);
      margin-bottom: .4rem;
      letter-spacing: .03em;
      text-transform: uppercase;
    }
    .field { margin-bottom: 1.25rem; }

    /* ── Language selector ──────────────────────────────── */
    .lang-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: .65rem;
      margin-bottom: 1.5rem;
    }
    .lang-btn {
      padding: .65rem .5rem;
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius);
      background: #fff;
      font-size: .9rem;
      cursor: pointer;
      text-align: center;
      transition: all var(--transition);
      color: var(--ink-mid);
      font-family: 'Source Sans 3', sans-serif;
    }
    .lang-btn:hover { border-color: var(--amber-light); background: var(--amber-pale); }
    .lang-btn.selected {
      border-color: var(--amber);
      background: var(--amber-pale);
      color: var(--amber);
      font-weight: 600;
    }
    .lang-flag { font-size: 1.3rem; display: block; margin-bottom: .2rem; }

    /* ── AI response box ────────────────────────────────── */
    .ai-response {
      background: var(--amber-pale);
      border-left: 3px solid var(--amber);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
      font-size: .97rem;
      color: var(--ink-mid);
      line-height: 1.7;
      font-style: italic;
    }
    .ai-response strong { font-style: normal; color: var(--amber); }

    /* ── Follow-up section ──────────────────────────────── */
    .followup-label {
      font-size: .82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-light);
      margin-bottom: .5rem;
    }

    /* ── Loading spinner ────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error / notice ─────────────────────────────────── */
    .notice {
      padding: .75rem 1rem;
      border-radius: var(--radius);
      font-size: .9rem;
      margin-bottom: 1rem;
    }
    .notice.error { background: #fdf3f2; border: 1px solid #e8b4b1; color: var(--red-warn); }
    .notice.info  { background: var(--amber-pale); border: 1px solid var(--amber-light); color: var(--ink-mid); }

    /* ── Chapter summary list ───────────────────────────── */
    .chapter-list { list-style: none; }
    .chapter-list li {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      padding: .65rem 0;
      border-bottom: 1px solid var(--parchment);
      font-size: .93rem;
      color: var(--ink-mid);
    }
    .chapter-list li:last-child { border: none; }
    .chap-num {
      font-family: 'Lora', serif;
      font-weight: 600;
      color: var(--amber);
      min-width: 1.4rem;
    }
    .chap-done { color: #4a7c59; font-weight: 600; font-size: .8rem; }

    /* ── Final screen ───────────────────────────────────── */
    .final-hero {
      text-align: center;
      padding: 1.5rem 0;
    }
    .final-hero .big-icon { font-size: 3.5rem; }
    .final-hero h2 {
      font-family: 'Lora', serif;
      font-size: 1.6rem;
      margin: .75rem 0 .5rem;
    }
    .final-hero p { color: var(--ink-mid); max-width: 480px; margin: 0 auto 1.5rem; }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 520px) {
      .card { padding: 1.4rem; }
      .btn-row { flex-direction: column; }
      .btn { justify-content: center; }
    }
  </style>
</head>

async function callAI(systemPrompt, userMessage, maxTokens = 600) {
  const p = state.provider;
  const key = state.apiKey;

  // ── Gemini ──────────────────────────────────────────
  if (p === 'gemini') {
    const model = PROVIDERS.gemini.model;
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: 'user', parts: [{ text: userMessage }] }],
        generationConfig: { maxOutputTokens: maxTokens, temperature: 0.8 },
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || res.statusText);
    }
    const data = await res.json();
    return data.candidates[0].content.parts[0].text.trim();
  }

  // ── Groq ─────────────────────────────────────────────
  if (p === 'groq') {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`,
      },
      body: JSON.stringify({
        model: PROVIDERS.groq.model,
        max_tokens: maxTokens,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user',   content: userMessage },
        ],
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err?.error?.message || res.statusText);
    }
    const data = await res.json();
    return data.choices[0].message.content.trim();
  }

  // ── Claude ───────────────────────────────────────────
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: PROVIDERS.claude.model,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMessage }],
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || res.statusText);
  }
  const data = await res.json();
  return data.content[0].text.trim();
}

// Minimal DEFLATE-raw via CompressionStream (supported in all modern browsers)
async function deflateRaw(data) {
  const cs = new CompressionStream('deflate-raw');
  const writer = cs.writable.getWriter();
  writer.write(data);
  writer.close();
  const chunks = [];
  const reader = cs.readable.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  const total = chunks.reduce((s, c) => s + c.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

function crc32(data) {
  let crc = 0xFFFFFFFF;
  const table = crc32.table || (crc32.table = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c;
    }
    return t;
  })());
  for (let i = 0; i < data.length; i++) crc = table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function u16le(n) { return [n & 0xFF, (n >> 8) & 0xFF]; }
function u32le(n) { return [n & 0xFF, (n >> 8) & 0xFF, (n >> 16) & 0xFF, (n >> 24) & 0xFF]; }

async function buildZip(files) {
  // files: [{name, data: Uint8Array}]
  const enc = new TextEncoder();
  const entries = [];
  let offset = 0;
  const parts = [];

  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const compressed = await deflateRaw(f.data);
    const crc = crc32(f.data);
    const localHeader = new Uint8Array([
      0x50,0x4B,0x03,0x04,       // sig
      0x14,0x00,                  // version needed: 2.0
      0x00,0x00,                  // flags
      0x08,0x00,                  // compression: deflate
      0x00,0x00,0x00,0x00,        // mod time/date
      ...u32le(crc),
      ...u32le(compressed.length),
      ...u32le(f.data.length),
      ...u16le(nameBytes.length),
      0x00,0x00,                  // extra field length
      ...nameBytes,
    ]);
    entries.push({ nameBytes, crc, compSize: compressed.length, uncompSize: f.data.length, offset });
    parts.push(localHeader, compressed);
    offset += localHeader.length + compressed.length;
  }

  // Central directory
  const cdParts = [];
  for (const e of entries) {
    const cd = new Uint8Array([
      0x50,0x4B,0x01,0x02,
      0x14,0x00,0x14,0x00,
      0x00,0x00,
      0x08,0x00,
      0x00,0x00,0x00,0x00,
      ...u32le(e.crc),
      ...u32le(e.compSize),
      ...u32le(e.uncompSize),
      ...u16le(e.nameBytes.length),
      0x00,0x00,0x00,0x00,0x00,0x00,
      0x00,0x00,0x00,0x00,
      ...u32le(e.offset),
      ...e.nameBytes,
    ]);
    cdParts.push(cd);
  }
  const cdData = concat(cdParts);
  const eocd = new Uint8Array([
    0x50,0x4B,0x05,0x06,
    0x00,0x00,0x00,0x00,
    ...u16le(entries.length),
    ...u16le(entries.length),
    ...u32le(cdData.length),
    ...u32le(offset),
    0x00,0x00,
  ]);
  return concat([...parts, cdData, eocd]);
}

function concat(arrays) {
  const total = arrays.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const a of arrays) { out.set(a, off); off += a.length; }
  return out;
}

function xmlEsc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&apos;');
}

function makeParaXml(text, opts = {}) {
  const { bold, size = 24, color = '2B2416', center = false,
          italic = false, pageBreak = false, spaceBefore = 0,
          spaceAfter = 200, firstIndent = 0, heading = false } = opts;
  const pPr = `<w:pPr>
      ${heading ? `<w:pStyle w:val="Heading1"/>` : ''}
      ${center ? `<w:jc w:val="center"/>` : ''}
      ${pageBreak ? `<w:pageBreakBefore/>` : ''}
      <w:spacing w:before="${spaceBefore}" w:after="${spaceAfter}" w:line="360" w:lineRule="auto"/>
      ${firstIndent ? `<w:ind w:firstLine="${firstIndent}"/>` : ''}
    </w:pPr>`;
  const rPr = `<w:rPr>
      <w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/>
      <w:sz w:val="${size}"/><w:szCs w:val="${size}"/>
      ${bold ? `<w:b/><w:bCs/>` : ''}
      ${italic ? `<w:i/><w:iCs/>` : ''}
      <w:color w:val="${color}"/>
    </w:rPr>`;
  return `<w:p>${pPr}<w:r>${rPr}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}

      <w:sz w:val="36"/><w:szCs w:val="36"/>
      <w:color w:val="2B2416"/>
    </w:rPr>
  </w:style>
</w:styles>`;

  // ── Relationships ─────────────────────────────────────
  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;

  const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml"  ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml"   ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
  <Override PartName="/word/footer1.xml"  ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>
</Types>`;

  const files = [
    { name: '[Content_Types].xml',       data: enc.encode(contentTypesXml) },
    { name: '_rels/.rels',               data: enc.encode(rootRelsXml) },
    { name: 'word/document.xml',         data: enc.encode(documentXml) },
    { name: 'word/styles.xml',           data: enc.encode(stylesXml) },
    { name: 'word/footer1.xml',          data: enc.encode(footerXml) },
    { name: 'word/_rels/document.xml.rels', data: enc.encode(relsXml) },
  ];

  const zipData = await buildZip(files);
  return new Blob([zipData], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

// ── Screen 0: Language selection ─────────────────────
function renderLangScreen() {
  screen().innerHTML = `
    <div class="card">
      <p style="font-family:'Lora',serif; font-size:1.1rem; margin-bottom:1.5rem; color:var(--ink-mid);">
        Choose your language / Escolha seu idioma / Sprache wählen
      </p>
      <div class="lang-grid">
        ${Object.entries(LANGS).map(([code, l]) => `
          <button class="lang-btn" data-lang="${code}">
            <span class="lang-flag">${l.flag}</span>
            ${l.label}
          </button>
        `).join('')}
      </div>
    </div>
  `;
  // Check for backup in localStorage
  try {
    const backup = localStorage.getItem('bio_backup');
    if (backup) {
      const b = JSON.parse(backup);
      const saved = new Date(b.savedAt).toLocaleString();
      const banner = document.createElement('div');
      banner.className = 'notice info';
      banner.style.cssText = 'margin-bottom:1rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;';
      banner.innerHTML = `
        <span>💾 Backup encontrado: <strong>${b.authorName}</strong> — ${b.answers.length} respostas (${saved})</span>
        <button id="restore-btn" class="btn btn-secondary" style="font-size:.82rem; padding:.4rem .9rem;">Restaurar</button>
      `;
      screen().prepend(banner);
      document.getElementById('restore-btn').addEventListener('click', () => {
        state.lang       = b.lang;
        state.authorName = b.authorName;
        state.answers    = b.answers;
        // restore position to generate screen
        state.chapterIdx  = 7;
        state.questionIdx = 1;
        document.getElementById('main-title').textContent    = LANGS[b.lang].ui.appTitle;
        document.getElementById('main-subtitle').textContent = LANGS[b.lang].ui.appSubtitle;
        document.documentElement.lang = b.lang;
        renderGenerateScreen();
      });
    }
  } catch(e) {}

  screen().querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.lang = btn.dataset.lang;
      document.getElementById('main-title').textContent    = LANGS[state.lang].ui.appTitle;
      document.getElementById('main-subtitle').textContent = LANGS[state.lang].ui.appSubtitle;
      document.documentElement.lang = state.lang;
      renderSetupScreen();
    });
  });
}

// ── Screen 1: Provider + name ─────────────────────────
function renderSetupScreen() {
  const ui = t();
  screen().innerHTML = `
    <div class="card">
      <h2 style="font-family:'Lora',serif; margin-bottom:1.25rem; font-size:1.3rem;">${ui.step0Title}</h2>
      <p style="color:var(--ink-mid); margin-bottom:1.75rem;">${ui.step0Intro}</p>

      <div class="field">
        <label for="provider-select">Provedor de IA / AI Provider</label>
        <div style="position:relative;">
          <select id="provider-select">
            <option value="groq" selected>🟢 Groq (Llama 3.3) — gratuito</option>
            <option value="gemini">🟢 Google Gemini — gratuito</option>
            <option value="claude">🔵 Claude / Anthropic — pago</option>
          </select>
          <span style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-light);">▾</span>
        </div>
      </div>

      <div id="custom-key-field" style="display:none;" class="field">
        <label for="api-key">API Key</label>
        <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off" />
      </div>

      <div class="field">
        <label for="author-name">${ui.authorNameLabel}</label>
        <input type="text" id="author-name" placeholder="${ui.authorNamePlaceholder}" />
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="start-btn">${ui.startBtn}</button>
      </div>
    </div>
  `;

  $('provider-select').addEventListener('change', () => {
    const p = $('provider-select').value;
    state.provider = p;
    // Show key field only for Claude (not hardcoded)
    $('custom-key-field').style.display = p === 'claude' ? 'block' : 'none';
    if (p !== 'claude') state.apiKey = HARDCODED_KEYS[p];
  });

  $('start-btn').addEventListener('click', () => {
    const name = $('author-name').value.trim();
    if (!name) { showError(ui.errorName); return; }
    state.provider   = $('provider-select').value;
    if (state.provider === 'claude') {
      const key = ($('api-key') && $('api-key').value.trim());
      if (!key) { showError(ui.errorApiKey); return; }
      state.apiKey = key;
    }
    state.authorName  = name;
    state.chapterIdx  = 0;
    state.questionIdx = 0;
    state.answers     = [];
    renderQuestionScreen();
  });
}

// ── Screen 2: Question + optional follow-up ───────────
function renderQuestionScreen() {
  const ui    = t();
  const chaps = chapters();

  const chap = chaps[state.chapterIdx];
  let question = chap.questions[state.questionIdx];
  // Personalize first question of chapter 1 with author name
  if (state.chapterIdx === 0 && state.questionIdx === 0 && state.authorName) {
    const greetMap = {
      pt: `${state.authorName}, onde você nasceu e em que ano? Como era o lugar onde cresceu?`,
      en: `${state.authorName}, where were you born and in what year? What was the place like where you grew up?`,
      de: `${state.authorName}, wo wurden Sie geboren und in welchem Jahr? Wie war der Ort, in dem Sie aufgewachsen sind?`,
      es: `${state.authorName}, ¿dónde naciste y en qué año? ¿Cómo era el lugar donde creciste?`,
      fr: `${state.authorName}, où êtes-vous né(e) et en quelle année\u00A0? Comment était l\u2019endroit où vous avez grandi\u00A0?`,
    };
    question = greetMap[state.lang] || question;
  }

  // reset transient state every time we land on a new question
  state.followupQuestion  = null;
  state.awaitingFollowup  = false;
  state.pendingAnswer     = '';
  state.pendingFollowup   = '';

  const canGoBack = state.chapterIdx > 0 || state.questionIdx > 0;

  screen().innerHTML = `
    <div id="progress-wrap">
      <div id="progress-label">
        <span id="progress-current"></span>
        <span id="progress-pct"></span>
      </div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div class="card" id="question-card">
      <div class="chapter-title">${chap.title}</div>
      <div class="question-text">${question}</div>

      <div id="ai-response-zone"></div>

      <label class="followup-label" id="answer-label" style="margin-bottom:.5rem;">${ui.yourAnswerLabel}</label>
      <textarea id="answer-box" placeholder="..." rows="5"></textarea>

      <div class="btn-row">
        <button class="btn btn-primary" id="next-btn">${ui.nextBtn}</button>
        <button class="btn btn-secondary" id="skip-btn">${ui.skipBtn}</button>
        ${canGoBack ? `<button class="btn btn-secondary" id="back-btn" style="margin-left:auto;">← Voltar</button>` : ''}
      </div>
      <div style="margin-top:.75rem; text-align:right;">
        <button class="btn btn-secondary" id="save-now-btn" style="font-size:.78rem; padding:.35rem .85rem; color:var(--ink-light);">💾 Salvar respostas</button>
      </div>
    </div>
  `;

  setProgress(state.chapterIdx + 1, chaps.length);

  $('next-btn').addEventListener('click', () => handleNextClick(question, chap.title));
  $('skip-btn').addEventListener('click', () => advanceQuestion(question, chap.title, '', null, ''));

  if (canGoBack) {
    $('back-btn').addEventListener('click', () => {
      // Remove last saved answer if it matches current position
      // Go back one question
      if (state.questionIdx > 0) {
        state.questionIdx--;
      } else {
        state.chapterIdx--;
        state.questionIdx = chaps[state.chapterIdx].questions.length - 1;
      }
      // Remove the last pushed answer so it can be redone
      if (state.answers.length > 0) state.answers.pop();
      renderQuestionScreen();
    });
  }

  $('save-now-btn').addEventListener('click', () => {
    if (!state.answers.length) { showError('Nenhuma resposta ainda.'); return; }
    const data = JSON.stringify({ lang: state.lang, authorName: state.authorName, answers: state.answers, savedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${state.authorName.replace(/\s+/g,'_')}_respostas.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  });
}

async function handleNextClick(question, chapterTitle) {
  const ui = t();
  const answer = $('answer-box').value.trim();

  // Phase 1: user answered main question → get follow-up
  if (!state.awaitingFollowup) {
    if (!answer) return;
    state.pendingAnswer    = answer;
    state.awaitingFollowup = true;

    // disable + show spinner
    const nextBtn = $('next-btn');
    const skipBtn = $('skip-btn');
    nextBtn.disabled = skipBtn.disabled = true;
    nextBtn.innerHTML = `<span class="spinner"></span> ${ui.thinking}`;

    try {
      const fq = await getFollowupQuestion(chapterTitle, question, answer);
      state.followupQuestion = fq;

      const zone = $('ai-response-zone');
      zone.innerHTML = `
        <div class="ai-response"><strong>✦</strong> ${fq}</div>
        <label class="followup-label" style="margin-bottom:.5rem;">${ui.followupLabel}</label>
      `;
      $('answer-label').style.display = 'none';
      $('answer-box').value = '';
      $('answer-box').placeholder = '...';
      nextBtn.innerHTML = ui.nextBtn;
      nextBtn.disabled  = false;
      skipBtn.disabled  = false;
    } catch (e) {
      // If follow-up fails, just advance
      advanceQuestion(question, chapterTitle, answer, null, '');
    }

  // Phase 2: user answered follow-up → advance
  } else {
    state.pendingFollowup = $('answer-box').value.trim();
    advanceQuestion(question, chapterTitle, state.pendingAnswer, state.followupQuestion, state.pendingFollowup);
  }
}

function advanceQuestion(question, chapterTitle, answer, followup, followupAnswer) {
  const chaps = chapters();
  state.answers.push({
    chapter:         chapterTitle,
    chapterIdx:      state.chapterIdx,
    question,
    answer,
    followup,
    followupAnswer,
  });
  // Auto-save to localStorage after every answer
  try {
    localStorage.setItem('bio_backup', JSON.stringify({
      lang: state.lang,
      authorName: state.authorName,
      answers: state.answers,
      savedAt: new Date().toISOString(),
    }));
  } catch(e) {}

  const chap = chaps[state.chapterIdx];
  if (state.questionIdx < chap.questions.length - 1) {
    state.questionIdx++;
  } else if (state.chapterIdx < chaps.length - 1) {
    state.chapterIdx++;
    state.questionIdx = 0;
  } else {
    renderGenerateScreen();
    return;
  }
  renderQuestionScreen();
}

// ── Screen 3: Generate ────────────────────────────────
function renderGenerateScreen() {
  const ui    = t();
  const chaps = chapters();

  // Group answers by chapter
  const byChapter = {};
  for (const a of state.answers) {
    if (!byChapter[a.chapterIdx]) byChapter[a.chapterIdx] = [];
    byChapter[a.chapterIdx].push(a);
  }

  const chapterItems = chaps.map((c, i) => {
    const done = byChapter[i] && byChapter[i].some(a => a.answer);
    return `<li><span class="chap-num">${i+1}</span> <span>${c.title}</span> ${done ? `<span class="chap-done" style="margin-left:auto;">✓</span>` : ''}</li>`;
  }).join('');

  screen().innerHTML = `
    <div class="card">
      <div class="chapter-title">${ui.chaptersProgress}</div>
      <ul class="chapter-list">${chapterItems}</ul>
      <div class="btn-row" style="margin-top:1.75rem;">
        <button class="btn btn-primary" id="generate-btn">${ui.finishBtn}</button>
        <button class="btn btn-secondary" id="backup-btn">⬇ Salvar respostas (JSON)</button>
      </div>
      <div id="gen-status"></div>
    </div>
  `;

  $('generate-btn').addEventListener('click', () => runGeneration(byChapter, chaps));

  $('backup-btn').addEventListener('click', () => {
    const data = JSON.stringify({
      lang: state.lang,
      authorName: state.authorName,
      answers: state.answers,
      savedAt: new Date().toISOString(),
    }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url2 = URL.createObjectURL(blob);
      const a2 = document.createElement('a');
      a2.href = url2; a2.download = `${state.authorName.replace(/\s+/g,'_')}_respostas.json`;
      document.body.appendChild(a2); a2.click();
      setTimeout(() => { URL.revokeObjectURL(url2); a2.remove(); }, 1000);
  });
}

async function runGeneration(byChapter, chaps) {
  const ui = t();
  const genBtn = $('generate-btn');
  const status = $('gen-status');
  genBtn.disabled = true;
  genBtn.innerHTML = `<span class="spinner" style="border-top-color:var(--amber); border-color:rgba(201,123,42,.2);"></span> ${ui.generating}`;

  const narratives = [];
  for (let i = 0; i < chaps.length; i++) {
    const qas = byChapter[i];
    if (!qas || !qas.some(a => a.answer)) {
      narratives.push(null);
      continue;
    }
    status.innerHTML = `<p style="color:var(--ink-light); font-size:.88rem; margin-top:1rem; text-align:center;">${chaps[i].title}…</p>`;
    try {
      const narrative = await generateNarrative(chaps[i].title, qas);
      narratives.push(narrative);
    } catch (e) {
      narratives.push(qas.map(a => a.answer).filter(Boolean).join('\n\n'));
    }
  }

  status.innerHTML = `<p style="color:var(--ink-light); font-size:.88rem; margin-top:1rem; text-align:center;">📄 DOCX…</p>`;
  try {
    const blob = await generateDocx(narratives);
    state.docxBlob = blob;
    renderFinalScreen();
  } catch (e) {
    genBtn.disabled = false;
    genBtn.innerHTML = ui.finishBtn;
    showError(ui.errorApi + e.message);
  }
}

// ── Screen 4: Final ───────────────────────────────────
function renderFinalScreen() {
  const ui = t();
  screen().innerHTML = `
    <div class="card final-hero">
      <div class="big-icon">📖</div>
      <h2>${ui.finalTitle}</h2>
      <p>${ui.finalMessage}</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" id="dl-btn">${ui.downloadBtn}</button>
        <button class="btn btn-secondary" id="restart-btn">${ui.restartBtn}</button>
      </div>
    </div>
  `;

  $('dl-btn').addEventListener('click', () => {
    const filename = `${state.authorName.replace(/\s+/g, '_')}_historia.docx`;
    const url = URL.createObjectURL(state.docxBlob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  });

  $('restart-btn').addEventListener('click', () => {
    state.lang = null; state.apiKey = ''; state.authorName = '';
    state.chapterIdx = 0; state.questionIdx = 0;
    state.answers = []; state.docxBlob = null;
    renderLangScreen();
  });
}
