<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agente Biográfico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream:       #F7F2EA;
      --parchment:   #EDE4D3;
      --ink:         #2B2416;
      --ink-mid:     #5C4F3A;
      --ink-light:   #9A8B73;
      --amber:       #C97B2A;
      --amber-light: #E8A84E;
      --amber-pale:  #FBF0DE;
      --amber-deep:  #A0601A;
      --red-warn:    #B03A2E;
      --radius:      10px;
      --shadow:      0 4px 28px rgba(43,36,22,.09);
      --transition:  .25s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: 'Source Sans 3', sans-serif;
      background-color: var(--cream);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(201,123,42,.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(201,123,42,.04) 0%, transparent 50%);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.65;
    }

    #app {
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1.5rem 5rem;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 3.5rem 0 2.5rem;
      margin-bottom: 2.5rem;
      position: relative;
    }
    header::after {
      content: '';
      display: block;
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--amber), transparent);
      margin: 0 auto;
      margin-top: 2rem;
    }
    header .ornament {
      font-size: 1.1rem;
      color: var(--amber);
      letter-spacing: .35em;
      margin-bottom: 1rem;
      display: block;
      opacity: .7;
    }
    header h1 {
      font-family: 'Lora', serif;
      font-size: clamp(1.7rem, 4.5vw, 2.4rem);
      font-weight: 600;
      letter-spacing: -.02em;
      color: var(--ink);
      line-height: 1.2;
    }
    header p.subtitle {
      color: var(--ink-light);
      font-size: 1rem;
      margin-top: .6rem;
      font-weight: 300;
      font-style: italic;
      font-family: 'Lora', serif;
    }

    /* ── Cards ──────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid var(--parchment);
      border-radius: var(--radius);
      padding: 2.25rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      animation: fadeUp .45s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Progress ───────────────────────────────────────── */
    #progress-wrap { margin-bottom: 2rem; }
    #progress-label {
      display: flex;
      justify-content: space-between;
      font-size: .75rem;
      color: var(--ink-light);
      margin-bottom: .5rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    #progress-bar {
      height: 3px;
      background: var(--parchment);
      border-radius: 99px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--amber-deep), var(--amber-light));
      border-radius: 99px;
      transition: width .6s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }

    /* ── Chapter header ─────────────────────────────────── */
    .chapter-eyebrow {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    .chapter-number {
      font-family: 'Lora', serif;
      font-size: .8rem;
      font-weight: 600;
      color: var(--amber);
      letter-spacing: .1em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: .8;
    }
    .chapter-number-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--parchment), transparent);
    }
    .chapter-title {
      font-family: 'Lora', serif;
      font-size: 1.45rem;
      color: var(--ink);
      font-weight: 600;
      font-style: italic;
      margin-bottom: 1.5rem;
      line-height: 1.3;
    }
    .question-text {
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-family: 'Lora', serif;
      font-style: italic;
      padding-left: 1rem;
      border-left: 3px solid var(--amber-light);
    }

    /* ── Textarea ───────────────────────────────────────── */
    textarea {
      width: 100%;
      min-height: 140px;
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius);
      padding: .9rem 1.1rem;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 1rem;
      color: var(--ink);
      background: var(--cream);
      resize: vertical;
      transition: border-color var(--transition), box-shadow var(--transition);
      line-height: 1.7;
    }
    textarea:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(201,123,42,.10);
      background: #fff;
    }
    textarea::placeholder { color: var(--ink-light); font-style: italic; }

    /* ── Buttons ────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .75rem 1.75rem;
      border-radius: var(--radius);
      font-family: 'Source Sans 3', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all var(--transition);
      letter-spacing: .01em;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--amber), var(--amber-light));
      color: #fff;
      box-shadow: 0 2px 12px rgba(201,123,42,.25);
    }
    .btn-primary:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 18px rgba(201,123,42,.35);
    }
    .btn-secondary {
      background: transparent;
      border: 1.5px solid var(--parchment);
      color: var(--ink-mid);
    }
    .btn-secondary:not(:disabled):hover { background: var(--parchment); }
    .btn-row {
      display: flex;
      gap: .75rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    /* ── Inputs ─────────────────────────────────────────── */
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: .75rem 1.1rem;
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 1rem;
      color: var(--ink);
      background: var(--cream);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    input[type="text"]:focus, input[type="password"]:focus, select:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(201,123,42,.10);
      background: #fff;
    }
    select { appearance: none; cursor: pointer; }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--ink-mid);
      margin-bottom: .45rem;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .field { margin-bottom: 1.35rem; }

    /* ── Language selector ──────────────────────────────── */
    .lang-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: .65rem;
      margin-bottom: 1.5rem;
    }
    .lang-btn {
      padding: .75rem .5rem;
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius);
      background: #fff;
      font-size: .88rem;
      cursor: pointer;
      text-align: center;
      transition: all var(--transition);
      color: var(--ink-mid);
      font-family: 'Source Sans 3', sans-serif;
    }
    .lang-btn:hover { border-color: var(--amber-light); background: var(--amber-pale); }
    .lang-btn.selected { border-color: var(--amber); background: var(--amber-pale); color: var(--amber); font-weight: 600; }
    .lang-flag { font-size: 1.4rem; display: block; margin-bottom: .25rem; }

    /* ── AI follow-up ───────────────────────────────────── */
    .ai-followup-wrap {
      margin: 1.25rem 0;
      padding: 1.25rem 1.5rem;
      background: linear-gradient(135deg, #fffbf4, var(--amber-pale));
      border-radius: var(--radius);
      border: 1px solid rgba(201,123,42,.2);
      position: relative;
    }
    .ai-followup-wrap::before {
      content: '\201C';
      position: absolute;
      top: -.1rem;
      left: 1rem;
      font-family: 'Lora', serif;
      font-size: 3rem;
      color: var(--amber-light);
      line-height: 1;
      opacity: .5;
    }
    .ai-followup-label {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: .5rem;
    }
    .ai-followup-text {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--ink-mid);
      line-height: 1.7;
      padding-left: .5rem;
    }

    /* ── Answer label ───────────────────────────────────── */
    .answer-label {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--ink-light);
      margin-bottom: .5rem;
      display: block;
    }

    /* ── Spinner ────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Notices ────────────────────────────────────────── */
    .notice {
      padding: .8rem 1.1rem;
      border-radius: var(--radius);
      font-size: .9rem;
      margin-bottom: 1rem;
    }
    .notice.error { background: #fdf3f2; border: 1px solid #e8b4b1; color: var(--red-warn); }
    .notice.info  { background: var(--amber-pale); border: 1px solid var(--amber-light); color: var(--ink-mid); }

    /* ── Chapter summary list ───────────────────────────── */
    .chapter-list { list-style: none; }
    .chapter-list li {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .7rem 0;
      border-bottom: 1px solid var(--parchment);
      font-size: .93rem;
      color: var(--ink-mid);
    }
    .chapter-list li:last-child { border: none; }
    .chap-num { font-family: 'Lora', serif; font-weight: 600; color: var(--amber); min-width: 1.4rem; }
    .chap-done { color: #4a7c59; font-weight: 600; font-size: .78rem; margin-left: auto; }

    /* ── Photo upload ───────────────────────────────────── */
    .photo-upload-area {
      border: 2px dashed var(--parchment);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
      margin-top: 1.25rem;
      color: var(--ink-light);
      font-size: .88rem;
    }
    .photo-upload-area:hover { border-color: var(--amber-light); background: var(--amber-pale); }
    .photo-upload-area input[type=file] { display: none; }
    .photo-thumbs { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; justify-content: center; }
    .photo-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 2px solid var(--parchment); filter: sepia(80%); }

    /* ── Generation loading ─────────────────────────────── */
    .gen-loading {
      text-align: center;
      padding: 2rem 1rem;
    }
    .gen-loading .gen-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .6; transform: scale(1); }
      50%       { opacity: 1; transform: scale(1.08); }
    }
    .gen-loading .gen-chapter {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--ink-mid);
      margin-bottom: .5rem;
    }
    .gen-loading .gen-phrase {
      font-size: .88rem;
      color: var(--ink-light);
    }

    /* ── Cover card ─────────────────────────────────────── */
    .cover-section-title {
      font-family: 'Lora', serif;
      font-size: 1.1rem;
      font-style: italic;
      color: var(--ink-mid);
      margin-bottom: 1.25rem;
    }

    /* ── Final screen ───────────────────────────────────── */
    .final-hero {
      text-align: center;
      padding: 2rem 1rem;
    }
    .final-hero .book-icon {
      font-size: 4rem;
      display: block;
      margin-bottom: 1rem;
    }
    .final-hero h2 {
      font-family: 'Lora', serif;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: .75rem;
      color: var(--ink);
    }
    .final-hero .final-name {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--amber);
      margin-bottom: 1rem;
    }
    .final-hero p {
      color: var(--ink-mid);
      max-width: 460px;
      margin: 0 auto 1.75rem;
      line-height: 1.75;
      font-size: .97rem;
    }

    /* ── Divider ornament ───────────────────────────────── */
    .ornament-divider {
      text-align: center;
      color: var(--amber-light);
      letter-spacing: .3em;
      font-size: .85rem;
      margin: 1.5rem 0;
      opacity: .6;
    }

    @media (max-width: 520px) {
      .card { padding: 1.5rem; }
      .btn-row { flex-direction: column; }
      .btn { justify-content: center; }
    }
  </style>
</head>

function setProgress(current, total, chapterName) {
  const pct = total ? Math.round((current / total) * 100) : 0;
  $('progress-fill').style.width = pct + '%';
  $('progress-current').textContent = `${t().progressLabel} ${current} ${t().of} ${total}${chapterName ? ' — ' + chapterName : ''}`;
  $('progress-pct').textContent = pct + '%';
}

function showError(msg) {
  const el = document.createElement('div');
  el.className = 'notice error';
  el.textContent = msg;
  screen().prepend(el);
  setTimeout(() => el.remove(), 5000);
}

async function callAI(systemPrompt, userMessage, maxTokens = 600) {
  const p = state.provider;
  const key = state.apiKey;

  if (p === 'gemini') {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${PROVIDERS.gemini.model}:generateContent?key=${key}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: 'user', parts: [{ text: userMessage }] }],
        generationConfig: { maxOutputTokens: maxTokens, temperature: 0.85 },
      }),
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || res.statusText); }
    const data = await res.json();
    return data.candidates[0].content.parts[0].text.trim();
  }

  if (p === 'groq') {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({
        model: PROVIDERS.groq.model,
        max_tokens: maxTokens,
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMessage }],
      }),
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || res.statusText); }
    const data = await res.json();
    return data.choices[0].message.content.trim();
  }

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: PROVIDERS.claude.model,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMessage }],
    }),
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || res.statusText); }
  const data = await res.json();
  return data.content[0].text.trim();
}

- Écrivez à la première personne, comme la voix de la personne elle-même
- Le premier paragraphe doit s'ouvrir sur une image concrète ou un moment spécifique — jamais une généralisation
- Utilisez des noms propres, des lieux et des détails exacts des réponses
- Ton: chaleureux, honnête, sans mélodrame — comme une conversation intime devenue prose
- Chaque paragraphe doit avoir 4 à 6 phrases. Environ 500 mots au total.
- N'incluez PAS le titre du chapitre
- N'utilisez PAS de clichés
- Si une réponse est courte, approfondissez le sentiment implicite — n'inventez pas de faits`,
  };

  const sys = systemMap[lang] || systemMap.en;
  let user = `Capítulo: ${chapterTitle}\n\n`;
  for (const qa of qas) {
    user += `P: ${qa.question}\nR: ${qa.answer || '(sem resposta)'}\n`;
    if (qa.followup && qa.followupAnswer) {
      user += `P (aprofundamento): ${qa.followup}\nR: ${qa.followupAnswer}\n`;
    }

  }
  return callAI(sys, user, 1500);
}

async function fileToSepiaBase64(file, maxPx = 1200) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxPx || h > maxPx) {
          if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else       { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const imageData = ctx.getImageData(0, 0, w, h);
        const d = imageData.data;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i+1], b = d[i+2];
          d[i]   = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
          d[i+1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
          d[i+2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
        }
        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', 0.88));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function composeMosaic(b64list, targetW = 1200) {
  if (b64list.length === 1) return b64list[0];
  return new Promise((resolve) => {
    const imgs = [];
    let loaded = 0;
    for (const src of b64list) {
      const img = new Image();
      img.onload = () => { loaded++; if (loaded === b64list.length) buildMosaic(); };
      img.src = src;
      imgs.push(img);
    }
    function buildMosaic() {
      const n = imgs.length;
      const cols = n <= 2 ? n : n <= 4 ? 2 : 3;
      const rows = Math.ceil(n / cols);
      const cellW = Math.floor(targetW / cols);
      const cellH = cellW;
      const canvas = document.createElement('canvas');
      canvas.width = cols * cellW; canvas.height = rows * cellH;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#F7F2EA';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      imgs.forEach((img, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        const x = col * cellW + 2, y = row * cellH + 2;
        const w = cellW - 4, h = cellH - 4;
        const scale = Math.max(w / img.width, h / img.height);
        const sw = img.width * scale, sh = img.height * scale;
        const sx = (sw - w) / 2, sy = (sh - h) / 2;
        ctx.drawImage(img, -sx / scale, -sy / scale, img.width, img.height, x, y, w, h);
      });
      resolve(canvas.toDataURL('image/jpeg', 0.88));
    }
  });
}

async function fetchCoverImage(authorName, chap1Summary) {
  const prompt = encodeURIComponent(
    `vintage sepia memoir book cover, warm candlelight, handwritten pages, old photographs, soft bokeh, biographical portrait, person named ${authorName}, ${chap1Summary}, painterly, nostalgic`
  );
  const url = `https://image.pollinations.ai/prompt/${prompt}?width=800&height=1100&nologo=true&seed=${Date.now()}`;
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    const blob = await res.blob();
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(blob);
    });
  } catch { return null; }
}

function base64ToBytes(b64) {
  const raw = b64.includes(',') ? b64.split(',')[1] : b64;
  const bin = atob(raw);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// ═══════════════════════════════════════════════════════
//  DOCX GENERATION
// ═══════════════════════════════════════════════════════
async function deflateRaw(data) {
  const cs = new CompressionStream('deflate-raw');
  const writer = cs.writable.getWriter();
  writer.write(data); writer.close();
  const chunks = [];
  const reader = cs.readable.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  const total = chunks.reduce((s, c) => s + c.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

function crc32(data) {
  let crc = 0xFFFFFFFF;
  const table = crc32.table || (crc32.table = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c;
    }
    return t;
  })());
  for (let i = 0; i < data.length; i++) crc = table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function u16le(n) { return [n & 0xFF, (n >> 8) & 0xFF]; }
function u32le(n) { return [n & 0xFF, (n >> 8) & 0xFF, (n >> 16) & 0xFF, (n >> 24) & 0xFF]; }

async function buildZip(files) {
  const enc = new TextEncoder();
  const entries = [];
  let offset = 0;
  const parts = [];
  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const compressed = await deflateRaw(f.data);
    const crc = crc32(f.data);
    const localHeader = new Uint8Array([
      0x50,0x4B,0x03,0x04, 0x14,0x00, 0x00,0x00, 0x08,0x00,
      0x00,0x00,0x00,0x00,
      ...u32le(crc), ...u32le(compressed.length), ...u32le(f.data.length),
      ...u16le(nameBytes.length), 0x00,0x00, ...nameBytes,
    ]);
    entries.push({ nameBytes, crc, compSize: compressed.length, uncompSize: f.data.length, offset });
    parts.push(localHeader, compressed);
    offset += localHeader.length + compressed.length;
  }
  const cdParts = [];
  for (const e of entries) {
    cdParts.push(new Uint8Array([
      0x50,0x4B,0x01,0x02, 0x14,0x00,0x14,0x00, 0x00,0x00, 0x08,0x00,
      0x00,0x00,0x00,0x00,
      ...u32le(e.crc), ...u32le(e.compSize), ...u32le(e.uncompSize),
      ...u16le(e.nameBytes.length),
      0x00,0x00,0x00,0x00,0x00,0x00, 0x00,0x00,0x00,0x00,
      ...u32le(e.offset), ...e.nameBytes,
    ]));
  }
  const cdData = concat(cdParts);
  const eocd = new Uint8Array([
    0x50,0x4B,0x05,0x06, 0x00,0x00,0x00,0x00,
    ...u16le(entries.length), ...u16le(entries.length),
    ...u32le(cdData.length), ...u32le(offset), 0x00,0x00,
  ]);
  return concat([...parts, cdData, eocd]);
}

function concat(arrays) {
  const total = arrays.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const a of arrays) { out.set(a, off); off += a.length; }
  return out;
}

function xmlEsc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

function makeParaXml(text, opts = {}) {
  const { bold, size = 24, color = '2B2416', center = false, italic = false,
          pageBreak = false, spaceBefore = 0, spaceAfter = 200,
          firstIndent = 0, heading = false } = opts;
  const pPr = `<w:pPr>
    ${heading ? `<w:pStyle w:val="Heading1"/>` : ''}
    ${center ? `<w:jc w:val="center"/>` : ''}
    ${pageBreak ? `<w:pageBreakBefore/>` : ''}
    <w:spacing w:before="${spaceBefore}" w:after="${spaceAfter}" w:line="380" w:lineRule="auto"/>
    ${firstIndent ? `<w:ind w:firstLine="${firstIndent}"/>` : ''}
  </w:pPr>`;
  const rPr = `<w:rPr>
    <w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/>
    <w:sz w:val="${size}"/><w:szCs w:val="${size}"/>
    ${bold ? `<w:b/><w:bCs/>` : ''}
    ${italic ? `<w:i/><w:iCs/>` : ''}
    <w:color w:val="${color}"/>
  </w:rPr>`;
  return `<w:p>${pPr}<w:r>${rPr}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}

async function generateDocx(narratives, chapterImages = {}, coverB64 = null) {
  const enc = new TextEncoder();
  const chapsList = chapters();
  const titleMap = { pt:'Minhas Memórias', en:'My Memories', de:'Meine Erinnerungen', es:'Mis Memorias', fr:'Mes Mémoires' };
  const byMap    = { pt:'por', en:'by', de:'von', es:'por', fr:'par' };

  // Title page

  if (coverB64) {

    const coverName  = `image${imgCounter}.jpeg`;

    const rId = imgCounter; imgCounter++;
    imgRels.push({ rId: rId + 10, name: coverName });
    body += makeImageXml(rId, 4320000, 5940000);
    body += makeParaXml('', { spaceAfter: 240, spaceBefore: 0 });
  }
  body += makeParaXml(bookTitle,                       { bold:true, size:52, center:true, spaceAfter:360, spaceBefore:0 });
  body += makeParaXml(`${byWord} ${state.authorName}`, { italic:true, size:28, color:'5C4F3A', center:true, spaceAfter:200, spaceBefore:0 });
  body += makeParaXml(dateStr,                         { size:22, color:'9A8B73', center:true, spaceAfter:0, spaceBefore:0 });
  body += `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;

  for (let i = 0; i < narratives.length; i++) {
    const narrative = narratives[i];
    if (!narrative) continue;
    const chap = chapsList[i];
    body += makeParaXml(`${i+1}. ${chap.title}`, { heading:true, bold:true, size:36, spaceBefore:0, spaceAfter:280 });
    const paras = narrative.split(/\n+/).filter(p => p.trim());
    for (const para of paras) {
      body += makeParaXml(para, { firstIndent: 720, spaceAfter: 220, size: 24 });
    }
    if (chapterImages[i] && chapterImages[i].length > 0) {
      const mosaicB64 = await composeMosaic(chapterImages[i]);
      const imgBytes  = base64ToBytes(mosaicB64);
      const imgName   = `image${imgCounter}.jpeg`;
      imageFiles.push({ name: `word/media/${imgName}`, data: imgBytes });
      const rId = imgCounter; imgCounter++;
      imgRels.push({ rId: rId + 10, name: imgName });
      body += makeParaXml('', { spaceAfter: 120, spaceBefore: 240 });
      body += makeImageXml(rId, 5760000, 5760000);
    }
    if (i < narratives.length - 1) {
      body += `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
    }
  }

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:wpc="http://schemas.microsoft.com/office/word/2010/wordprocessingCanvas"
  xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
  xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <w:body>${body}
    <w:sectPr>
      <w:footerReference w:type="default" r:id="rId1"/>
      <w:pgSz w:w="11906" w:h="16838"/>
      <w:pgMar w:top="1440" w:right="1440" w:bottom="1800" w:left="1800"/>
    </w:sectPr>
  </w:body>
</w:document>`;

  const footerXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:p>
    <w:pPr><w:jc w:val="center"/></w:pPr>
    <w:r><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/><w:sz w:val="18"/><w:color w:val="9A8B73"/></w:rPr>
      <w:t xml:space="preserve">${xmlEsc(state.authorName)}  ·  </w:t></w:r>
    <w:r><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/><w:sz w:val="18"/><w:color w:val="9A8B73"/></w:rPr>
      <w:fldChar w:fldCharType="begin"/></w:r>
    <w:r><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/><w:sz w:val="18"/><w:color w:val="9A8B73"/></w:rPr>
      <w:instrText> PAGE </w:instrText></w:r>
    <w:r><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/><w:sz w:val="18"/><w:color w:val="9A8B73"/></w:rPr>
      <w:fldChar w:fldCharType="end"/></w:r>
  </w:p>
</w:ftr>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults><w:rPrDefault><w:rPr>
    <w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/>
    <w:sz w:val="24"/><w:szCs w:val="24"/>
  </w:rPr></w:rPrDefault></w:docDefaults>
  <w:style w:type="paragraph" w:styleId="Normal"><w:name w:val="Normal"/></w:style>
  <w:style w:type="paragraph" w:styleId="Heading1">
    <w:name w:val="heading 1"/>
    <w:basedOn w:val="Normal"/>
    <w:pPr>
      <w:spacing w:before="560" w:after="280"/>
      <w:outlineLvl w:val="0"/>
      <w:pBdr><w:bottom w:val="single" w:sz="4" w:space="10" w:color="C97B2A"/></w:pBdr>
    </w:pPr>
    <w:rPr>
      <w:b/><w:bCs/>
      <w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/>
      <w:sz w:val="36"/><w:szCs w:val="36"/>
      <w:color w:val="2B2416"/>
    </w:rPr>
  </w:style>
</w:styles>`;

  const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const imgRelEntries = imgRels.map(r =>
    `<Relationship Id="rId${r.rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${r.name}"/>`
  ).join('\n  ');

  const imgContentTypes = imageFiles.map(f =>
    `<Override PartName="/${f.name}" ContentType="image/jpeg"/>`
  ).join('\n  ');

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml"  ContentType="application/xml"/>
  <Default Extension="jpeg" ContentType="image/jpeg"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml"   ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
  <Override PartName="/word/footer1.xml"  ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>
  ${imgContentTypes}
</Types>`;

  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
  ${imgRelEntries}
</Relationships>`;

  const files = [
    { name: '[Content_Types].xml',          data: enc.encode(contentTypesXml) },
    { name: '_rels/.rels',                  data: enc.encode(rootRelsXml) },
    { name: 'word/document.xml',            data: enc.encode(documentXml) },
    { name: 'word/styles.xml',              data: enc.encode(stylesXml) },
    { name: 'word/footer1.xml',             data: enc.encode(footerXml) },
    { name: 'word/_rels/document.xml.rels', data: enc.encode(relsXml) },
    ...imageFiles,
  ];

  const zipData = await buildZip(files);
  return new Blob([zipData], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

        const chaps = LANGS[b.lang].chapters;

          for (let qi = 0; qi < chaps[ci].questions.length; qi++) {
            if (totalQ >= b.answers.length) {
              state.chapterIdx = ci; state.questionIdx = qi;

}

    <div class="card">
      <h2 style="font-family:'Lora',serif; margin-bottom:.5rem; font-size:1.4rem;">${ui.step0Title}</h2>
      <p style="color:var(--ink-mid); margin-bottom:2rem; font-size:.97rem;">${ui.step0Intro}</p>

      <div class="field">
        <label>${ui.providerLabel}</label>
        <div style="position:relative;">
          <select id="provider-select">
            <option value="groq" selected>🟢 Groq (Llama 3.3) — ${ui.providerLabel === 'Provedor de IA' ? 'gratuito' : 'free'}</option>
            <option value="gemini">🟢 Google Gemini — ${ui.providerLabel === 'Provedor de IA' ? 'gratuito' : 'free'}</option>
            <option value="claude">🔵 Claude / Anthropic — ${ui.providerLabel === 'Provedor de IA' ? 'pago' : 'paid'}</option>
          </select>
          <span style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-light);">▾</span>
        </div>
      </div>

      <div id="custom-key-field" style="display:none;" class="field">
        <label>${ui.apiKeyLabel}</label>
        <input type="password" id="api-key" placeholder="${ui.apiKeyPlaceholder}" autocomplete="off" />
      </div>

      <div class="field">
        <label>${ui.authorNameLabel}</label>
        <input type="text" id="author-name" placeholder="${ui.authorNamePlaceholder}" />
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="start-btn">${ui.startBtn}</button>
      </div>
    </div>
  `;

  $('provider-select').addEventListener('change', () => {
    const p = $('provider-select').value;
    state.provider = p;
    $('custom-key-field').style.display = p === 'claude' ? 'block' : 'none';
    if (p !== 'claude') state.apiKey = HARDCODED_KEYS[p];
  });

  $('start-btn').addEventListener('click', () => {
    const name = $('author-name').value.trim();
    if (!name) { showError(ui.errorName); return; }
    state.provider  = $('provider-select').value;
    if (state.provider === 'claude') {
      const key = $('api-key')?.value.trim();
      if (!key) { showError(ui.errorApiKey); return; }
      state.apiKey = key;
    }
    state.authorName  = name;
    state.chapterIdx  = 0;
    state.questionIdx = 0;
    state.answers     = [];
    renderQuestionScreen();
  });
}

function renderQuestionScreen() {
  const ui    = t();
  const chaps = chapters();
  const chap  = chaps[state.chapterIdx];
  let question = chap.questions[state.questionIdx];

  if (state.chapterIdx === 0 && state.questionIdx === 0 && state.authorName) {
    const greetMap = {
      pt: `${state.authorName}, feche os olhos e pense na casa onde você cresceu. O que você vê, ouve ou sente quando está lá?`,
      en: `${state.authorName}, close your eyes and think of the house where you grew up. What do you see, hear, or feel when you are there?`,
      de: `${state.authorName}, schließen Sie die Augen und denken Sie an das Haus, in dem Sie aufgewachsen sind. Was sehen, hören oder fühlen Sie?`,
      es: `${state.authorName}, cierra los ojos y piensa en la casa donde creciste. ¿Qué ves, escuchas o sientes cuando estás allí?`,
      fr: `${state.authorName}, fermez les yeux et pensez à la maison où vous avez grandi. Que voyez-vous, entendez-vous ou ressentez-vous ?`,
    };
    question = greetMap[state.lang] || question;
  }

  state.followupQuestion = null;
  state.awaitingFollowup = false;
  state.pendingAnswer    = '';

  const canGoBack = state.chapterIdx > 0 || state.questionIdx > 0;
  const chapNum   = state.chapterIdx + 1;

  screen().innerHTML = `
    <div id="progress-wrap">
      <div id="progress-label">
        <span id="progress-current"></span>
        <span id="progress-pct"></span>
      </div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div class="card" id="question-card">
      <div class="chapter-eyebrow">
        <span class="chapter-number">${ui.progressLabel} ${chapNum}</span>
        <span class="chapter-number-line"></span>
      </div>
      <div class="chapter-title">${chap.title}</div>
      <div class="question-text">${question}</div>

      <div id="ai-response-zone"></div>

      <span class="answer-label" id="answer-label">${ui.yourAnswerLabel}</span>
      <textarea id="answer-box" placeholder="..." rows="5"></textarea>

      <div class="photo-upload-area" id="photo-drop">
        <label for="photo-input" style="cursor:pointer; text-transform:none; letter-spacing:0; font-size:.88rem; font-weight:400; color:var(--ink-light);">
          ${ui.photoLabel}<br>
          <span style="font-size:.78rem;">${ui.photoHint}</span>
        </label>
        <input type="file" id="photo-input" accept="image/*" multiple />
        <div class="photo-thumbs" id="photo-thumbs"></div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="next-btn">${ui.nextBtn}</button>
        <button class="btn btn-secondary" id="skip-btn">${ui.skipBtn}</button>
        ${canGoBack ? `<button class="btn btn-secondary" id="back-btn" style="margin-left:auto;">← Voltar</button>` : ''}
      </div>
      <div style="margin-top:.75rem; text-align:right;">
        <button class="btn btn-secondary" id="save-now-btn" style="font-size:.78rem; padding:.35rem .85rem; color:var(--ink-light);">💾 ${ui.backupBtn.replace('⬇ ','')}</button>
      </div>
    </div>
  `;

  setProgress(chapNum, chaps.length, chap.title);

  $('next-btn').addEventListener('click', () => handleNextClick(question, chap.title));
  $('skip-btn').addEventListener('click', () => advanceQuestion(question, chap.title, '', null, ''));

  if (canGoBack) {
    $('back-btn').addEventListener('click', () => {
      if (state.questionIdx > 0) { state.questionIdx--; }
      else { state.chapterIdx--; state.questionIdx = chaps[state.chapterIdx].questions.length - 1; }
      if (state.answers.length > 0) state.answers.pop();
      renderQuestionScreen();
    });
  }

  $('save-now-btn').addEventListener('click', () => {
    if (!state.answers.length) { showError(ui.errorNoAnswers); return; }
    const data = JSON.stringify({ lang: state.lang, authorName: state.authorName, answers: state.answers, savedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `${state.authorName.replace(/\s+/g,'_')}_respostas.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  });

  const chapIdx = state.chapterIdx;
  const thumbs  = $('photo-thumbs');
  if (state.photos[chapIdx]) {
    for (const b64 of state.photos[chapIdx]) {
      const img = document.createElement('img');
      img.className = 'photo-thumb'; img.src = b64; thumbs.appendChild(img);
    }
  }
  $('photo-input').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      const b64 = await fileToSepiaBase64(file, 1200);
      if (!state.photos[chapIdx]) state.photos[chapIdx] = [];
      state.photos[chapIdx].push(b64);
      const img = document.createElement('img');
      img.className = 'photo-thumb'; img.src = b64; thumbs.appendChild(img);
    }
    e.target.value = '';
  });
  $('photo-drop').addEventListener('dragover', e => { e.preventDefault(); $('photo-drop').style.borderColor = 'var(--amber)'; });
  $('photo-drop').addEventListener('dragleave', () => { $('photo-drop').style.borderColor = ''; });
  $('photo-drop').addEventListener('drop', async (e) => {
    e.preventDefault(); $('photo-drop').style.borderColor = '';
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    for (const file of files) {
      const b64 = await fileToSepiaBase64(file, 1200);
      if (!state.photos[chapIdx]) state.photos[chapIdx] = [];
      state.photos[chapIdx].push(b64);
      const img = document.createElement('img');
      img.className = 'photo-thumb'; img.src = b64; thumbs.appendChild(img);
    }
  });
}

async function handleNextClick(question, chapterTitle) {
  const ui     = t();
  const answer = $('answer-box').value.trim();

  if (!state.awaitingFollowup) {
    if (!answer) return;
    state.pendingAnswer    = answer;
    state.awaitingFollowup = true;
    const nextBtn = $('next-btn'), skipBtn = $('skip-btn');
    nextBtn.disabled = skipBtn.disabled = true;
    nextBtn.innerHTML = `<span class="spinner"></span> ${ui.thinking}`;
    try {
      const fq = await getFollowupQuestion(chapterTitle, question, answer);
      state.followupQuestion = fq;
      $('ai-response-zone').innerHTML = `
        <div class="ai-followup-wrap">
          <div class="ai-followup-label">${ui.aiAsksLabel}</div>
          <div class="ai-followup-text">${fq}</div>
        </div>
      `;
      $('answer-label').style.display = 'none';
      $('answer-box').value = '';
      nextBtn.innerHTML = ui.nextBtn;
      nextBtn.disabled = skipBtn.disabled = false;
    } catch (e) {
      advanceQuestion(question, chapterTitle, answer, null, '');
    }
  } else {
    advanceQuestion(question, chapterTitle, state.pendingAnswer, state.followupQuestion, $('answer-box').value.trim());
  }
}

function advanceQuestion(question, chapterTitle, answer, followup, followupAnswer) {
  const chaps = chapters();
  state.answers.push({ chapter: chapterTitle, chapterIdx: state.chapterIdx, question, answer, followup, followupAnswer });
  try {
    localStorage.setItem('bio_backup', JSON.stringify({
      lang: state.lang, authorName: state.authorName,
      answers: state.answers, savedAt: new Date().toISOString(),
    }));
  } catch(e) {}

  const chap = chaps[state.chapterIdx];
  if (state.questionIdx < chap.questions.length - 1) {
    state.questionIdx++;
  } else if (state.chapterIdx < chaps.length - 1) {
    state.chapterIdx++;
    state.questionIdx = 0;
  } else {
    renderGenerateScreen();
    return;
  }
  renderQuestionScreen();
}

function renderGenerateScreen() {
  const ui    = t();
  const chaps = chapters();
  const byChapter = {};
  for (const a of state.answers) {
    if (!byChapter[a.chapterIdx]) byChapter[a.chapterIdx] = [];
    byChapter[a.chapterIdx].push(a);
  }

  const chapterItems = chaps.map((c, i) => {
    const done = byChapter[i] && byChapter[i].some(a => a.answer);
    return `<li><span class="chap-num">${i+1}</span><span>${c.title}</span>${done ? `<span class="chap-done">✓</span>` : ''}</li>`;
  }).join('');

  screen().innerHTML = `
    <div class="card">
      <p style="font-family:'Lora',serif; font-style:italic; color:var(--ink-mid); margin-bottom:1.25rem; font-size:1rem;">${ui.chaptersProgress}</p>
      <ul class="chapter-list">${chapterItems}</ul>
      <div class="btn-row" style="margin-top:1.5rem;">
        <button class="btn btn-secondary" id="backup-btn">${ui.backupBtn}</button>
      </div>
    </div>

    <div class="card" id="cover-card">
      <p class="cover-section-title">${ui.coverTitle}</p>
      <div id="cover-preview-wrap" style="text-align:center; margin-bottom:1.25rem;">
        <div id="cover-placeholder" style="
          width:160px; height:220px; margin:0 auto;
          background:var(--parchment); border-radius:var(--radius);
          display:flex; align-items:center; justify-content:center;
          color:var(--ink-light); font-size:.82rem; border:1.5px dashed var(--amber-light);
          font-family:'Lora',serif; font-style:italic;
        ">${ui.coverNone}</div>
        <img id="cover-preview" src="" alt="Cover" style="
          display:none; width:160px; border-radius:var(--radius);
          box-shadow:var(--shadow); filter:sepia(20%);
        "/>
      </div>
      <div class="btn-row" style="justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-primary" id="gen-cover-btn">${ui.coverGenerate}</button>
        <button class="btn btn-secondary" id="regen-cover-btn" style="display:none;">${ui.coverRegenerate}</button>
        <label class="btn btn-secondary" for="cover-upload-input" style="cursor:pointer;">${ui.coverUpload}</label>
        <input type="file" id="cover-upload-input" accept="image/*" style="display:none;"/>
      </div>
      <p id="cover-status" style="text-align:center; font-size:.82rem; color:var(--ink-light); margin-top:.75rem;"></p>
      <div class="ornament-divider">✦ ✦ ✦</div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" id="generate-btn" style="padding:.85rem 2.5rem; font-size:1rem;">${ui.finishBtn}</button>
      </div>
      <div id="gen-status"></div>
    </div>
  `;

  $('backup-btn').addEventListener('click', () => {
    const data = JSON.stringify({ lang: state.lang, authorName: state.authorName, answers: state.answers, savedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `${state.authorName.replace(/\s+/g,'_')}_respostas.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  });

  function showCoverPreview(b64) {
    state.coverImageB64 = b64;
    $('cover-placeholder').style.display = 'none';
    const img = $('cover-preview');
    img.src = b64; img.style.display = 'block';
    $('regen-cover-btn').style.display = 'inline-flex';
    $('cover-status').textContent = '';
  }

  async function doGenCover() {
    $('gen-cover-btn').disabled = $('regen-cover-btn').disabled = true;
    $('cover-status').innerHTML = `<span class="spinner" style="border-top-color:var(--amber);border-color:rgba(201,123,42,.2);vertical-align:middle;display:inline-block;"></span> ${ui.coverGenerating}`;
    const chap1Summary = (byChapter[0] || []).map(a => a.answer).filter(Boolean).join(' ').slice(0, 150);
    const b64 = await fetchCoverImage(state.authorName, chap1Summary);
    $('gen-cover-btn').disabled = $('regen-cover-btn').disabled = false;
    if (b64) { showCoverPreview(b64); }
    else { $('cover-status').textContent = ui.coverError; }
  }

  $('gen-cover-btn').addEventListener('click', doGenCover);
  $('regen-cover-btn').addEventListener('click', doGenCover);
  $('cover-upload-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const b64 = await fileToSepiaBase64(file, 800);
    showCoverPreview(b64);
    e.target.value = '';
  });
  if (state.coverImageB64) showCoverPreview(state.coverImageB64);

  $('generate-btn').addEventListener('click', () => runGeneration(byChapter, chaps));
}

async function runGeneration(byChapter, chaps) {
  const ui     = t();
  const genBtn = $('generate-btn');
  const status = $('gen-status');
  genBtn.disabled = true;
  genBtn.innerHTML = `<span class="spinner" style="border-top-color:var(--amber);border-color:rgba(201,123,42,.2);"></span> ${ui.generating}`;

  // Emotional loading state
  status.innerHTML = `
    <div class="gen-loading">
      <span class="gen-icon">${ui.genLoadingIcon}</span>
      <div class="gen-chapter" id="gen-chapter-name">${chaps[0].title}…</div>
      <div class="gen-phrase">${ui.genPhrase}</div>
    </div>
  `;

  const narratives = [];
  for (let i = 0; i < chaps.length; i++) {
    const qas = byChapter[i];
    const chapNameEl = document.getElementById('gen-chapter-name');
    if (chapNameEl) chapNameEl.textContent = `${chaps[i].title}…`;
    if (!qas || !qas.some(a => a.answer)) { narratives.push(null); continue; }
    try {
      narratives.push(await generateNarrative(chaps[i].title, qas));
    } catch (e) {
      narratives.push(qas.map(a => a.answer).filter(Boolean).join('\n\n'));
    }
  }

  try {
    const blob = await generateDocx(narratives, state.photos, state.coverImageB64);
    state.docxBlob = blob;
    renderFinalScreen();
  } catch (e) {
    genBtn.disabled = false;
    genBtn.innerHTML = ui.finishBtn;
    showError(ui.errorApi + e.message);
  }
}

function renderFinalScreen() {
  const ui = t();
  screen().innerHTML = `
    <div class="card final-hero">
      <span class="book-icon">📖</span>
      <h2>${ui.finalTitle}</h2>
      <div class="final-name">${state.authorName}</div>
      <p>${ui.finalMessage}</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" id="dl-btn" style="padding:.85rem 2.25rem;">${ui.downloadBtn}</button>
        <button class="btn btn-secondary" id="restart-btn">${ui.restartBtn}</button>
      </div>
    </div>
  `;

  $('dl-btn').addEventListener('click', () => {
    const filename = `${state.authorName.replace(/\s+/g,'_')}_memorias.docx`;
    const url = URL.createObjectURL(state.docxBlob);
    const a   = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  });

  $('restart-btn').addEventListener('click', () => {
    Object.assign(state, { lang:null, apiKey:'', authorName:'', chapterIdx:0, questionIdx:0, answers:[], docxBlob:null, photos:{}, coverImageB64:null });
    renderLangScreen();
  });
}

// ── Boot ─────────────────────────────────────────────
renderLangScreen();
</script>
</body>
</html>
